# Spring Boot application name 
spring.application.name=backend

# Specifies the JDBC driver used to connect to the MySQL database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically updates the database schema to match the entity classes
# without deleting existing data
spring.jpa.hibernate.ddl-auto=update

# Keeps the database session open while rendering the web response
spring.jpa.open-in-view=true

# Imports additional configuration from local.properties if it exists
# 'optional:' prevents startup from failing if the file is missing
spring.config.import=optional:./local.properties

# Displays the SQL statements generated by Hibernate in the console
# Useful for debugging and learning
spring.jpa.show-sql=true